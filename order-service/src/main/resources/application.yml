server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: order_user
    password: order_pass
    hikari:
      pool-name: order-pool
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                       # wait for the broker to persist before ack
    consumer:
      group-id: notification-group    # demonstrates fan-out: a 2nd independent consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# MyBatis: map snake_case columns to camelCase, load XML mappers, and register a
# UUID <-> PostgreSQL uuid type handler package.
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.ecommerce.order.infra.mybatis
  configuration:
    map-underscore-to-camel-case: true

# Downstream inventory-service.
inventory:
  base-url: http://localhost:8081

# How long an unpaid order stays open before the timeout scanner cancels it.
order:
  payment-timeout: PT15M
  timeout:
    scan-interval-ms: 5000
    batch-size: 200
  reconcile:
    interval-ms: 10000
    stuck-after-seconds: 30
    batch-size: 100

# Retry + circuit breaker for the synchronous reserve call.
resilience4j:
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - com.ecommerce.order.infra.client.InventoryUnavailableException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        record-exceptions:
          - com.ecommerce.order.infra.client.InventoryUnavailableException
        ignore-exceptions:
          - com.ecommerce.common.error.BusinessException

# Shared secret used to verify payment callback signatures (mock gateway).
payment:
  callback-secret: dev-callback-secret-change-in-prod

# Transactional outbox relay.
outbox:
  relay-interval-ms: 200
  batch-size: 100
  max-retry: 10
  topic: order.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
