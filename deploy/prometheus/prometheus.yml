global:
  scrape_interval: 5s

scrape_configs:
  # The services run on the host; Docker Desktop exposes the host as
  # host.docker.internal from inside containers.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
